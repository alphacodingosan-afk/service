<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 테트리스 🎮 | 웹 놀이터</title>
  <style>
    :root {
      --bg: #fff7fb;
      --panel: rgba(255, 255, 255, 0.9);
      --pink: #ff9eaa;
      --purple: #c4b5fd;
      --text: #334155;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff1f5, #fffdf0 50%, #eef8ff);
    }

    .game-shell {
      width: min(100%, 760px);
      padding: 28px;
      text-align: center;
      background: var(--panel);
      border: 2px solid rgba(255, 158, 170, 0.35);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(148, 163, 184, 0.2);
    }

    h1 { margin: 0 0 6px; font-size: clamp(2rem, 6vw, 3rem); }
    .subtitle { margin: 0 0 22px; color: var(--muted); }

    .game-area {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
    }

    canvas {
      display: block;
      width: min(70vw, 300px);
      height: auto;
      background: #172033;
      border: 8px solid #fff;
      border-radius: 16px;
      box-shadow: 0 8px 22px rgba(51, 65, 85, 0.2);
    }

    .side-panel {
      min-width: 155px;
      display: grid;
      gap: 12px;
      text-align: left;
    }

    .stat, .help {
      padding: 14px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 5px 15px rgba(148, 163, 184, 0.12);
    }

    .stat strong { display: block; margin-top: 4px; font-size: 1.5rem; color: #8b5cf6; }
    .help { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--pink);
      box-shadow: 0 5px 12px rgba(255, 158, 170, 0.3);
      transition: transform 0.2s, filter 0.2s;
    }

    button:hover { transform: translateY(-2px); filter: brightness(0.97); }
    button:active { transform: translateY(0); }

    .mobile-controls { display: none; margin-top: 18px; gap: 8px; justify-content: center; }
    .mobile-controls button { min-width: 52px; padding: 12px; background: var(--purple); }
    .mobile-controls .wide { min-width: 82px; }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(30, 41, 59, 0.45);
    }

    .overlay.show { display: flex; }
    .dialog { max-width: 320px; padding: 28px; text-align: center; background: #fff; border-radius: 24px; }
    .dialog h2 { margin-top: 0; }

    @media (max-width: 560px) {
      .game-shell { padding: 20px 14px; }
      .game-area { gap: 10px; }
      .side-panel { min-width: 112px; }
      .stat, .help { padding: 10px; }
      .help { font-size: 0.75rem; }
      .mobile-controls { display: flex; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1>미니 테트리스 🎮</h1>
    <p class="subtitle">블록을 쌓아 줄을 완성해 보세요!</p>

    <section class="game-area" aria-label="테트리스 게임">
      <canvas id="board" width="240" height="480" aria-label="테트리스 보드"></canvas>
      <aside class="side-panel">
        <div class="stat">점수<strong id="score">0</strong></div>
        <div class="stat">줄<strong id="lines">0</strong></div>
        <button id="startButton" type="button">게임 시작</button>
        <button id="pauseButton" type="button">일시정지</button>
        <div class="help">
          <b>조작법</b><br>
          ← → 이동<br>
          ↓ 빠르게 내리기<br>
          ↑ 회전<br>
          스페이스 즉시 내리기<br>
          P 일시정지
        </div>
      </aside>
    </section>

    <div class="mobile-controls" aria-label="모바일 조작 버튼">
      <button type="button" data-action="left">←</button>
      <button type="button" data-action="rotate">↻</button>
      <button type="button" data-action="down">↓</button>
      <button type="button" data-action="right">→</button>
      <button type="button" class="wide" data-action="drop">내리기</button>
    </div>
  </main>

  <div id="gameOver" class="overlay" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
    <div class="dialog">
      <h2 id="gameOverTitle">게임 오버 😢</h2>
      <p>최종 점수: <strong id="finalScore">0</strong></p>
      <button id="restartButton" type="button">다시 시작</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('board');
    const context = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const linesElement = document.getElementById('lines');
    const startButton = document.getElementById('startButton');
    const pauseButton = document.getElementById('pauseButton');
    const gameOverOverlay = document.getElementById('gameOver');
    const finalScore = document.getElementById('finalScore');

    const columns = 10;
    const rows = 20;
    const blockSize = 24;
    const colors = [null, '#f87171', '#fb923c', '#facc15', '#4ade80', '#38bdf8', '#818cf8', '#c084fc'];
    const pieces = [
      [[1, 1, 1, 1]],
      [[2, 0, 0], [2, 2, 2]],
      [[0, 0, 3], [3, 3, 3]],
      [[4, 4], [4, 4]],
      [[0, 5, 5], [5, 5, 0]],
      [[0, 6, 0], [6, 6, 6]],
      [[7, 7, 0], [0, 7, 7]]
    ];

    let board = createBoard();
    let player = { matrix: null, position: { x: 0, y: 0 } };
    let score = 0;
    let lines = 0;
    let dropCounter = 0;
    let lastTime = 0;
    let dropInterval = 800;
    let animationId = null;
    let running = false;
    let paused = false;

    function createBoard() {
      return Array.from({ length: rows }, () => Array(columns).fill(0));
    }

    function drawCell(x, y, color) {
      context.fillStyle = colors[color];
      context.fillRect(x * blockSize, y * blockSize, blockSize, blockSize);
      context.strokeStyle = 'rgba(255,255,255,0.2)';
      context.strokeRect(x * blockSize, y * blockSize, blockSize, blockSize);
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => row.forEach((value, x) => {
        if (value) drawCell(x + offset.x, y + offset.y, value);
      }));
    }

    function draw() {
      context.fillStyle = '#172033';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(board, { x: 0, y: 0 });
      if (player.matrix) drawMatrix(player.matrix, player.position);
    }

    function collide(arena, playerData) {
      const matrix = playerData.matrix;
      const position = playerData.position;
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (matrix[y][x] && (arena[y + position.y] && arena[y + position.y][x + position.x]) !== 0) return true;
        }
      }
      return false;
    }

    function merge(arena, playerData) {
      playerData.matrix.forEach((row, y) => row.forEach((value, x) => {
        if (value) arena[y + playerData.position.y][x + playerData.position.x] = value;
      }));
    }

    function clearLines() {
      let cleared = 0;
      outer: for (let y = board.length - 1; y >= 0; y--) {
        if (board[y].every(Boolean)) {
          board.splice(y, 1);
          board.unshift(Array(columns).fill(0));
          cleared++;
          y++;
        }
      }
      if (cleared) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared] || cleared * 250;
        dropInterval = Math.max(120, 800 - Math.floor(lines / 5) * 60);
        scoreElement.textContent = score;
        linesElement.textContent = lines;
      }
    }

    function playerReset() {
      player.matrix = pieces[Math.floor(Math.random() * pieces.length)].map(row => row.slice());
      player.position.y = 0;
      player.position.x = Math.floor(columns / 2) - Math.ceil(player.matrix[0].length / 2);
      if (collide(board, player)) endGame();
    }

    function playerMove(direction) {
      if (!running || paused) return;
      player.position.x += direction;
      if (collide(board, player)) player.position.x -= direction;
    }

    function playerDrop() {
      if (!running || paused) return;
      player.position.y++;
      if (collide(board, player)) {
        player.position.y--;
        merge(board, player);
        clearLines();
        playerReset();
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      if (!running || paused) return;
      do { player.position.y++; } while (!collide(board, player));
      player.position.y--;
      playerDrop();
    }

    function playerRotate() {
      if (!running || paused) return;
      const originalX = player.position.x;
      let offset = 1;
      rotate(player.matrix);
      while (collide(board, player)) {
        player.position.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, true);
          player.position.x = originalX;
          return;
        }
      }
    }

    function rotate(matrix, reverse = false) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < y; x++) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
      }
      if (reverse) matrix.reverse();
      else matrix.forEach(row => row.reverse());
    }

    function update(time = 0) {
      const delta = time - lastTime;
      lastTime = time;
      if (running && !paused) {
        dropCounter += delta;
        if (dropCounter > dropInterval) playerDrop();
      }
      draw();
      animationId = requestAnimationFrame(update);
    }

    function startGame() {
      board = createBoard();
      score = 0;
      lines = 0;
      dropInterval = 800;
      scoreElement.textContent = score;
      linesElement.textContent = lines;
      gameOverOverlay.classList.remove('show');
      running = true;
      paused = false;
      pauseButton.textContent = '일시정지';
      playerReset();
      if (!animationId) animationId = requestAnimationFrame(update);
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      pauseButton.textContent = paused ? '계속하기' : '일시정지';
    }

    function endGame() {
      running = false;
      paused = false;
      finalScore.textContent = score;
      gameOverOverlay.classList.add('show');
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') { event.preventDefault(); playerMove(-1); }
      else if (event.key === 'ArrowRight') { event.preventDefault(); playerMove(1); }
      else if (event.key === 'ArrowDown') { event.preventDefault(); playerDrop(); }
      else if (event.key === 'ArrowUp') { event.preventDefault(); playerRotate(); }
      else if (event.code === 'Space') { event.preventDefault(); playerHardDrop(); }
      else if (event.key.toLowerCase() === 'p') togglePause();
    });

    document.querySelectorAll('[data-action]').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        if (action === 'left') playerMove(-1);
        if (action === 'right') playerMove(1);
        if (action === 'down') playerDrop();
        if (action === 'rotate') playerRotate();
        if (action === 'drop') playerHardDrop();
      });
    });

    startButton.addEventListener('click', startGame);
    pauseButton.addEventListener('click', togglePause);
    document.getElementById('restartButton').addEventListener('click', startGame);

    draw();
    update();
  </script>
</body>
</html>
